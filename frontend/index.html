<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Analyzer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Sign in / register -->
  <section id="auth" class="auth hidden">
    <div class="card">
      <h1>Finance Analyzer</h1>
      <p class="muted small">ML analyses your spending; an LLM only explains it.</p>
      <form id="auth-form">
        <label id="name-field" class="hidden">Name <input name="name" autocomplete="name"></label>
        <label>Email <input name="email" type="email" required autocomplete="email"></label>
        <label>Password <input name="password" type="password" required minlength="8" autocomplete="current-password"></label>
        <p id="auth-error" class="error small"></p>
        <div class="row">
          <button class="btn" type="submit" id="auth-submit">Sign in</button>
          <button class="link" type="button" id="auth-toggle">Create an account</button>
        </div>
      </form>
    </div>
  </section>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <span class="brand">Finance Analyzer</span>
      <nav id="nav">
        <button data-view="overview">Overview</button>
        <button data-view="budgets">Budgets</button>
        <button data-view="transactions">Transactions</button>
        <button data-view="upload">Upload</button>
        <button data-view="anomalies">Anomalies</button>
      </nav>
      <span id="user" class="muted small"></span>
      <button class="btn secondary" id="logout">Sign out</button>
    </header>
    <main id="view"></main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
